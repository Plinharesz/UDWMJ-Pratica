<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juros Compostos</title>
    <link rel="stylesheet" href="lista03e03.css">
</head>
<body>
    <div class="container">
        <h2>Cálculo de Juros Compostos</h2>
        
        <label for="capital">Capital Inicial (C):</label>
        <input type="number" id="capital" placeholder="R$ 1000.00">
        
        <label for="taxa">Taxa de Juros (em %):</label>
        <input type="number" id="taxa" placeholder="Ex: 5 (para 5%)">
        
        <label for="tempo">Prazo/Tempo (t):</label>
        <input type="number" id="tempo" placeholder="Ex: 12">
        
        <button onclick="calcularMontante()">Calcular Montante</button>
        <div id="resultado" class="resultado"></div>
    </div>
    <script src="lista03e03.js"></script>
</body>
</html>
